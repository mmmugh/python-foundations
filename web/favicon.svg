<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Python Foundations">
  <!-- A prompt and a cursor: what the scratchpad shows, and what the terminal
       chapters will show. Drawn as paths rather than text, because a favicon
       renders without the page's fonts and would otherwise depend on whatever
       happens to be installed.

       The cursor sits ON the baseline, level with the foot of the chevron. A
       first version centered it, which at 16px reads as a dash rather than a
       prompt. Before that came three chevrons, truer to Python, which smear
       into an uncountable blob at that size. Both were settled by rasterizing
       at 16px and looking, which is the only way to tell.

       Note for editing: this is XML, so a comment may not contain two hyphens
       in a row. An earlier version did, which made the file unparseable and
       drew nothing at all. -->
  <rect width="32" height="32" rx="7" fill="#1f6f4a"/>
  <polyline points="8,10 15,16 8,22" fill="none" stroke="#fbfaf7"
            stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="17.5" y="20.7" width="8.5" height="3" rx="1.5" fill="#fbfaf7"/>
</svg>

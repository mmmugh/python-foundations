<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Python Foundations">
  <!-- A prompt and a cursor: what the scratchpad shows, and what a terminal
       shows. Drawn as paths rather than text, because a favicon is rendered
       without the page's fonts and would otherwise depend on what is installed.
       Three chevrons would be truer to Python's >>> but turn to mush at 16px;
       this was checked by rasterising it, not by guessing. -->
  <rect width="32" height="32" rx="7" fill="#1f6f4a"/>
  <polyline points="8,10 15,16 8,22" fill="none" stroke="#fbfaf7"
            stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="18" y="12.5" width="7" height="8" rx="1.2" fill="#fbfaf7"/>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{tab}}</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-slug="{{slug}}">

<header class="top">
  <a class="home" href="index.html">Python Foundations</a>
  <details class="toc">
    <summary>Contents</summary>
    <nav>{{nav}}</nav>
  </details>
</header>

<main>
  <p class="part">{{part}}</p>
  {{body}}
  <nav class="prevnext">{{prevnext}}</nav>
</main>

<div class="runtime" hidden><span class="dot"></span><span class="msg"></span></div>

<button class="scratch-tab" aria-expanded="false">Scratchpad</button>
<section class="scratchpad" hidden aria-label="Python scratchpad">
  <header>
    <span>Scratchpad — what you type here is remembered while you stay on this page</span>
    <button class="scratch-clear" title="Forget everything typed so far">Clear</button>
    <button class="scratch-close" aria-label="Close scratchpad">&times;</button>
  </header>
  <pre class="transcript"></pre>
  <div class="entry">
    <span class="caret">&gt;&gt;&gt;</span>
    <textarea rows="1" spellcheck="false" aria-label="Scratchpad input"></textarea>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>

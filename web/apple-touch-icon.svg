<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Python Foundations">
  <!-- The home screen variant of favicon.svg, and deliberately not the same
       drawing. iOS masks a touch icon into its own rounded square, so this one
       is full bleed with square corners; shipping the rounded tile instead
       rounds it twice and leaves the wallpaper showing in the gap.

       Same glyph, same colours. Edit both files together, or run
       scripts/make_icons.py which will tell you if they have drifted.

       Note: this is XML, so a comment may not contain two hyphens in a row. -->
  <rect width="32" height="32" fill="#1f6f4a"/>
  <polyline points="8,10 15,16 8,22" fill="none" stroke="#fbfaf7"
            stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="17.5" y="20.7" width="8.5" height="3" rx="1.5" fill="#fbfaf7"/>
</svg>
